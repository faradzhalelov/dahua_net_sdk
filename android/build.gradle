group 'com.dahua.sdk'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'com.dahua.sdk.dahua_sdk'
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            // Use the conventional jniLibs location inside the module sources so Gradle treats
            // native libraries as proper ABI libs: src/main/jniLibs/<abi>/lib*.so
            // We'll place the Dahua .so files into `src/main/jniLibs/arm64-v8a`.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libgnustl_shared.so'
        pickFirst 'lib/arm64-v8a/libgnustl_shared.so'
        // If multiple copies of the Dahua native libs for different ABIs exist, prefer the first found
        // to avoid merge errors when the same filenames exist across ABI folders.
        pickFirst 'lib/*/libavnetsdk.so'
        pickFirst 'lib/*/libconfigsdk.so'
        pickFirst 'lib/*/libhwdec.so'
        pickFirst 'lib/*/libjninetsdk.so'
        pickFirst 'lib/*/libjniplay.so'
        pickFirst 'lib/*/libjnismartconfig.so'
        pickFirst 'lib/*/libnetsdk.so'
        pickFirst 'lib/*/libplay.so'
        pickFirst 'lib/*/libStreamConvertor.so'
        pickFirst 'lib/*/libToUProxy.so'
        pickFirst 'lib/*/libcrypto.so'
        pickFirst 'lib/*/libssl.so'
    }
}

dependencies {
    // Dahua SDK JARs
    implementation files('libs/INetSDK.jar')
    implementation files('libs/IPlaySDK.jar')
    implementation files('libs/SmartConfig.jar')
    implementation files('libs/audiopairsdk.jar')
    implementation files('libs/libToUProxy.jar')
    implementation files('libs/zxing.jar')
    // Note: Android_DataGridView-1.01.aar removed - not used in our implementation
}
